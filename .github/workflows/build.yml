# Compiles every part of Nebula and runs its tests on each push and pull request (docs/BUILDING.md).
name: Build

on:
  push:
    # Only changes that can affect the build: not documentation, the Android app or the other workflows.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "!platform/android/**"
      - "platform/android/vk_seed_keys.bin"
      - "!.github/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!LICENSE"
      - "!platform/android/**"
      - "platform/android/vk_seed_keys.bin"
      - "!.github/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  import:
    name: Disc import tool (Rust)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p nebula-import
      - name: Test
        run: cargo test --locked -p nebula-import

  host:
    name: Host (${{ matrix.renderer }})
    # Visual Studio 2022's MSVC: with 2026's (MSVC 19.51, windows-2025) the frame interpolation and interp GPU
    # tests fail every palette check, which no other compiler reproduces.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer: Direct3D 12
            vulkan: OFF
          - renderer: Vulkan
            vulkan: ON
    env:
      # sccache keeps compiled objects in the GitHub Actions cache.
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      # The libraries CMake builds at configure time (zlib, xz, libarchive, the FidelityFX SDK) and the downloaded
      # Vulkan sources: each is skipped when its files are already in the build tree.
      - name: Cache configure-time dependencies
        uses: actions/cache@v4
        with:
          path: |
            build/host/archive-deps
            build/host/fidelityfx.built
            build/host/_deps
          key: host-deps-${{ matrix.vulkan }}-${{ hashFiles('cmake/**', 'third_party/archive/**') }}
      - uses: mozilla-actions/sccache-action@v0.0.9
      - name: Configure
        # Without cross-file optimization: the link of every test against the renderer library otherwise takes
        # minutes. Release builds keep it (NEBULA_HOST_IPO defaults to ON).
        run: >-
          cmake -S . -B build/host -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEBULA_VULKAN=${{ matrix.vulkan }}
          -DNEBULA_HOST_IPO=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        run: cmake --build build/host
      - name: Test
        run: ctest --test-dir build/host --output-on-failure

  game:
    name: Game module
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Clang version
        run: '& "C:\Program Files\LLVM\bin\clang.exe" --version'
      - name: Build
        run: .\native\build.ps1 -Petari native\petari -Build build\game

  sdk-tests:
    name: Native SDK tests
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build and run
        shell: bash
        run: |
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          sh native/sdk/os/tests/run_tests.sh native/petari build/sdk-tests clang
